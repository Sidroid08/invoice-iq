services:
  api:
    build: .
    image: invoice-iq:local
    ports:
      - "8000:8000"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      MODEL_DIR: /app/models
      CHROMA_DIR: /app/chroma
      LOG_LEVEL: INFO
    volumes:
      - chroma-data:/app/chroma
      - hf-cache:/home/appuser/.cache/huggingface

  # Streamlit demo UI — talks to the api service over HTTP (same image).
  ui:
    image: invoice-iq:local
    build: .
    command:
      - streamlit
      - run
      - src/invoice_iq/ui/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
    environment:
      INVOICE_IQ_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  chroma-data:
  hf-cache:
