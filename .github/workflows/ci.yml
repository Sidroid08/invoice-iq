name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · type · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"  # pinned to 3.11 (matches local venv)
          cache: "pip"

      - name: Install (project + dev tooling)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: mypy (strict)
        run: mypy

      - name: pytest
        run: pytest

      # Verifies the README metrics-sync mechanism runs cleanly (no-op until Phase 3).
      - name: Sync classifier metrics into README (check)
        run: python scripts/sync_metrics_readme.py
