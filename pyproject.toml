[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-iq"
version = "0.1.0"
description = "Invoice Intelligence Platform — Document AI extraction, RAG, agentic LangGraph orchestration, a trained PyTorch classifier, and FastAPI serving with full MLOps."
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "MIT" }
authors = [{ name = "Siddhant Jadhav", email = "siddhant823jadhav@gmail.com" }]
keywords = ["mlops", "vertex-ai", "rag", "langgraph", "pytorch", "document-ai", "fastapi"]

# Runtime dependencies grow per phase (mirrored in requirements.txt):
#   Phase 1: pydantic, pydantic-settings  [done]
#   Phase 2: pdfplumber, pymupdf, pytesseract, reportlab, anthropic (optional path)
#   Phase 3: torch, scikit-learn, numpy
#   Phase 4: sentence-transformers, chromadb
#   Phase 5: langgraph, langchain-core
#   Phase 6: fastapi, uvicorn, python-multipart
#   Phase 8: streamlit
dependencies = [
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "email-validator==2.3.0",
    "pdfplumber==0.11.9",
    "reportlab==4.5.1",
    "torch==2.12.0",
    "numpy==2.4.6",
    "sentence-transformers==5.5.1",
    "chromadb==1.5.9",
    "langgraph==1.2.4",
    "langchain-core==1.4.0",
    "fastapi==0.136.3",
    "uvicorn==0.49.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "ruff==0.8.4",
    "mypy==1.13.0",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "httpx2==2.3.0",
]
# Scanned-PDF OCR fallback. Also requires the Tesseract system binary on PATH.
ocr = [
    "pymupdf==1.26.4",
    "pytesseract==0.3.13",
]
# Optional LLM extraction path (off by default; needs ANTHROPIC_API_KEY).
llm = [
    "anthropic==0.69.0",
]

[project.urls]
Homepage = "https://github.com/Sidroid08/invoice-iq"

[tool.setuptools.packages.find]
where = ["src"]

# --------------------------------------------------------------------------- #
# Tooling configuration
# --------------------------------------------------------------------------- #

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear,
# C4: comprehensions, SIM: simplify, ANN: annotations
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]  # tests don't require full type annotations

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
files = ["src", "tests", "config", "scripts"]

[[tool.mypy.overrides]]
# Third-party libs we treat as untyped (no stubs, or stubs we don't type against).
# follow_imports=skip makes even py.typed packages (chromadb) resolve to Any.
module = [
    "pdfplumber.*",
    "reportlab.*",
    "fitz",
    "pytesseract",
    "anthropic.*",
    "sentence_transformers.*",
    "chromadb.*",
    "langgraph.*",
    "langchain_core.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gcp: marks tests that require GCP credentials (skipped in CI by default)",
]

[tool.coverage.run]
source = ["src/invoice_iq"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
